services:
  # Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agent
    networks:
      - agent_network
    restart: unless-stopped

  # AI Agent service
  agent:
    build: .
    expose:
      - "8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development
      - APP_NAME=Production AI Agent
      - AGENT_API_KEY=dev-secret-key-123
      - RATE_LIMIT_PER_MINUTE=20
      - DAILY_BUDGET_USD=5.0
      - LOG_LEVEL=INFO
    networks:
      - agent_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  agent_network:
    driver: bridge
